[project]
name = "linksight"
version = "0.1.0"
description = "Passive LLDP/CDP neighbor discovery — a desktop alternative to the Netool.io probe"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.6",
    "scapy>=2.5",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["linksight*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

